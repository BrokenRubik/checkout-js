# Only install versions published at least 7 days ago (minutes).
# Hijacked releases are normally found and unpublished within that window.
minimumReleaseAge: 10080

# The code base imports packages it does not declare directly,
# so keep an npm-style flat node_modules layout.
nodeLinker: hoisted

# Dependency install scripts are blocked unless set to true here.
# Native packages below ship prebuilt binaries as optional dependencies,
# so their fallback scripts are not needed.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  msw: false
  nx: false
  unrs-resolver: false

# pnpm version pin: package.json "packageManager" has the pnpm version and
# its sha512 hash. Corepack refuses a pnpm download that does not match, and
# pnpm itself fails when the running version does not match the pin. pnpm
# records the pinned pnpm packages and their hashes in pnpm-lock.yaml, as a
# second YAML document. Nx 22 reads both documents. Do not set
# "pmOnFail: ignore": it turns off the check and the record.

# Security fixes for transitive packages that their parents pin to a
# vulnerable major line.
overrides:
  # terser-webpack-plugin 5.x asks for ^6; 7.x has the same API.
  'serialize-javascript@<7.0.3': ^7.0.3
  # msw 1.x CLI -> inquirer -> external-editor asks for ^0.0.33.
  'tmp@<0.2.6': ^0.2.6
  # nx 22.7.12 pins these to exact vulnerable versions.
  'nx>axios': ^1.20.0
  'nx>brace-expansion': ^5.0.11
  'nx>smol-toml': ^1.7.1
  # GHSA-mrwp-f3q8-3g9p (1.16.0 - 1.16.1, used by axios, and pinned by
  # nx 22.7.12), and http-server -> http-proxy resolves an old 1.15.x.
  'follow-redirects@<1.16.2': ^1.16.2
  # qs DoS advisories (fixed in 6.16.1). express 4.22.3 already uses
  # ~6.16.0; @pollyjs/utils and union (http-server) ask for ^6.x.
  'qs@<6.16.1': ^6.16.1
