# Only install versions published at least 7 days ago (minutes).
# Hijacked releases are normally found and unpublished within that window.
minimumReleaseAge: 10080

# The code base imports packages it does not declare directly,
# so keep an npm-style flat node_modules layout.
nodeLinker: hoisted

# Dependency install scripts are blocked unless set to true here.
# Native packages below ship prebuilt binaries as optional dependencies,
# so their fallback scripts are not needed.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  msw: false
  nx: false
  unrs-resolver: false

# Do not record the pnpm pin in pnpm-lock.yaml. When pnpm records it, the
# lockfile has two YAML documents, and Nx 19 fails with "expected a single
# document in the stream". This also turns off pnpm's own version check, so
# Corepack enforces the pin: package.json "packageManager" has the pnpm
# version and its sha512 hash, and Corepack refuses a download that does
# not match. Nx 22 reads both documents, so remove this setting after the
# Nx upgrade.
pmOnFail: ignore

# Security fixes for transitive packages that their parents pin to a
# vulnerable major line.
overrides:
  # terser-webpack-plugin 5.x asks for ^6; 7.x has the same API.
  'serialize-javascript@<7.0.3': ^7.0.3
  # msw 1.x CLI -> inquirer -> external-editor asks for ^0.0.33.
  'tmp@<0.2.6': ^0.2.6
  # GHSA-mrwp-f3q8-3g9p (1.16.0 - 1.16.1, used by axios and nx), and
  # http-server -> http-proxy resolves an old 1.15.x.
  'follow-redirects@<1.16.2': ^1.16.2
  # qs DoS advisories (fixed in 6.16.1). express 4.22.3 already uses
  # ~6.16.0; @pollyjs/utils and union (http-server) ask for ^6.x.
  'qs@<6.16.1': ^6.16.1
